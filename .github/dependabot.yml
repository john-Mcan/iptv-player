version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      libvlc:
        patterns:
          - "LibVLCSharp*"
          - "VideoLAN.LibVLC.*"
      tests:
        patterns:
          - "xunit*"
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
